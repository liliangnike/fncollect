# fncollect tool configuration (committed defaults).
# Copy/overlay user-specific values into user/fncollect.local.yml (gitignored).

logging:
  level: INFO            # DEBUG | INFO | WARNING | ERROR
  console: true
  file: true
  log_dir: fncollect_out
  max_bytes: 10485760    # 10 MB per file
  backup_count: 5
  redact: []             # add secret strings here to scrub them from logs

run:
  output_dir: fncollect_out
  session_dir_prefix: run
  retention:
    enabled: true
    keep_days: 30

concurrency:
  max_parallel_devices: 4
  command_timeout_sec: 30.0

vendor: mock            # default vendor pack
