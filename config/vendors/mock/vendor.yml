vendor: mock
description: Deterministic in-memory vendor used for tests and demos.
transport: mock
device_types:
  - mock-OLT-1000
sessions:
  default:
    port: 22
  cli:
    port: 2222
  tnd:
    port: 11130
actions:
  - inventory
  - run_commands
commands:
  inventory:
    - "show version"
    - "show alarms"
    - "show ont summary"
dcps:
  - config/dcps/basic_collect.yml
