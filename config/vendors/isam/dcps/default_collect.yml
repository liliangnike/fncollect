name: isam_default_collect
vendor: isam
description: |
  Nokia ISAM (7360/7362) OLT SHELF default collection -- runs all three legs:
    - OLT CLI GENERIC/COMMON (session: cli)
    - NT_TND GENERIC/COMMON (session: tnd)
    - LT_TND GENERIC/COMMON (session: tnd, per enabled LT)
  Scope follows NGALEXX ISAM default collection (OLT_CLI/NT_TND/LT_TND).
parameters:
  - {name: db_running_container, type: string, default: "container_default"}
