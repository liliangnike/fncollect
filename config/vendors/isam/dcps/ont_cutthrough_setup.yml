name: isam_ont_cutthrough_setup
vendor: isam
description: |
  Provision the OLT (via the NT_TND session) to allow an ONT cutthrough
  session. Mirrors the NT_TND configuration approach: declare the debug vlan
  path, set the workstation client IP, provision the GPON index and verify.

  NOTE: the TND commands below are illustrative placeholders; replace them
  with the actual ISAM NT_TND CLI syntax for your release. The variable
  plumbing (client_ip -> space-separated, gpon index, dbg vlan) is wired
  through the DCP variable engine.
parameters:
  - {name: ont_gpon_index, type: string}
  - {name: client_ip, type: string}
  - {name: dbg_vlan, type: string, default: "4089"}
steps:
  - id: set_client_ip
    command: "ontSessionClientIpAddr {{ ont_client_ip_spaces }}"
    extract:
      - {name: cfg_ok, regex: "(?i)(ok|success)", group: 0}
  - id: provision_gpon
    command: "ont-provision gpon {{ ont_gpon_index }} dbg-vlan {{ dbg_vlan }}"
  - id: verify
    command: "ont-get-cfg gpon {{ ont_gpon_index }} ontSessionClientIpAddr"
    extract:
      - {name: ont_session_ip, regex: "([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})", group: 1}
