name: isam_probe
vendor: isam
description: Device initialization -- retrieve OLT system/basic info into the abstract device.
steps:
  - id: release
    command: "show software-mngt version ansi"
    extract:
      - {name: isam_feature_group, regex: "isam-feature-group : (R?\\S+)", group: 1}
      - {name: sw_version, regex: "R([0-9]+(?:\\.[0-9]+)+)", group: 1}
  - id: system_entry
    command: "show system entry"
    extract:
      - {name: mib_version, regex: "mib-version : (\\S+)", group: 1}
  - id: boards
    command: "show equipment slot"
    extract:
      - {name: nt_board, parser: grid, header_row: 0, kind: cell, row: 1, column: actual-type}
