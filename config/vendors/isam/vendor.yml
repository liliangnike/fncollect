vendor: isam
description: Nokia ISAM (7360/7362) OLT -- real interactive SSH CLI with context navigation.
transport: ssh
device_types:
  - 7360-ISAM
  - 7362-ISAM
sessions:
  cli:
    port: 22
    prompt: "typ:\\S+(?:>[^>#]+)*#"
actions:
  - inventory
  - ont_inventory
  - run_commands
commands:
  inventory:
    - "show system entry"
    - "show equipment shelf-summary"
    - "show equipment slot"
  ont_inventory:
    - "show equipment ont status"
    - "show pon unprovision-onu"
    - "show pon sfp-inventory"
probe:
  procedure: probe.yml
  mappings:
    sw_version: version
    nt_board: attributes.nt_board
dcps: []
