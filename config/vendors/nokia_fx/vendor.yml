vendor: nokia_fx
description: Exemplar GPON FX-style CLI dialect pack (illustrative, not wired to real transport).
transport: ssh
device_types:
  - OLT-FX
sessions:
  cli:
    port: 22
    prompt: "\\w+[>#]"
  tnd:
    port: 11130
    prompt: "TND[>#]"
actions:
  - inventory
  - run_commands
commands:
  inventory:
    - "show version"
    - "show alarms"
dcps: []
